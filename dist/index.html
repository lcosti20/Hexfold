<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hexfold</title>
  <style>
    /* The game keeps its canvas the size of <body> (fit_canvas_to_parent), so <body> must take its
       size from the window, never from the canvas, or the two grow each other on every resize. */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas#hexfold { display: block; width: 100% !important; height: 100% !important; outline: none; touch-action: none; }
  </style>
</head>
<body>
  <canvas id="hexfold" tabindex="0"></canvas>
  <script type="module">
    import init from "./hexfold.js";
    init();
    document.getElementById("hexfold").focus();
  </script>
</body>
</html>
